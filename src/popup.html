<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>راست‌چین Kick</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <div class="logo" aria-hidden="true">K</div>
        <div>
          <p class="eyebrow">KICK CHAT</p>
          <h1>راست‌چین فارسی</h1>
        </div>
        <span class="status" id="status">فعال</span>
      </header>
      <section class="card">
        <div class="setting-row">
          <div>
            <h2>اصلاح جهت پیام‌ها</h2>
            <p>فارسی، عربی، لینک، عدد و ایموجی</p>
          </div>
          <label class="switch" aria-label="فعال‌سازی اصلاح راست‌چین"
            ><input id="enabled" type="checkbox" checked /><span
              class="track"
            ></span
          ></label>
        </div>
        <label class="mode-label" for="mode">حالت نمایش</label>
        <select id="mode">
          <option value="smart">هوشمند — تشخیص خودکار</option>
          <option value="rtl">اجبار راست‌چین همهٔ پیام‌ها</option>
          <option value="ltr">اجبار چپ‌چین همهٔ پیام‌ها</option>
        </select>
        <p class="field-hint">برای هر پیام هم می‌توانید دکمهٔ Auto / RTL / LTR را بزنید.</p>
      </section>
      <section class="card">
        <h2 class="section-title">نمایش چت</h2>
        <label class="mode-label" for="font">فونت پیام‌های فارسی</label>
        <select id="font">
          <option value="vazirmatn">Vazirmatn — پیش‌فرض</option>
          <option value="arad">Arad</option>
          <option value="iransans">IRANSans</option>
          <option value="shabnam">Shabnam</option>
          <option value="system">فونت اصلی Kick</option>
        </select>
        <label class="mode-label" for="inputFont">فونت کادر نوشتن پیام</label>
        <select id="inputFont">
          <option value="vazirmatn">Vazirmatn — پیش‌فرض</option>
          <option value="arad">Arad</option>
          <option value="iransans">IRANSans</option>
          <option value="shabnam">Shabnam</option>
          <option value="system">فونت اصلی Kick</option>
        </select>
        <div class="two-options">
          <label
            ><span>تراکم چت</span
            ><select id="density">
              <option value="compact">فشرده</option>
              <option value="comfortable">راحت</option>
            </select></label
          ><label
            ><span>ظاهر کارت‌ها</span
            ><select id="surface">
              <option value="soft">نرم</option>
              <option value="midnight">تیره</option>
            </select></label
          >
        </div>
        <label class="mode-label" for="bubbleWidth">عرض پیام‌ها <output id="bubbleWidthValue">100%</output></label>
        <input id="bubbleWidth" class="range" type="range" min="50" max="100" step="5" value="100" />
        <label class="mode-label" for="fontSize">اندازهٔ متن <output id="fontSizeValue">14px</output></label>
        <input id="fontSize" class="range" type="range" min="11" max="22" step="1" value="14" />
      </section>
      <section class="card">
        <h2 class="section-title">رفتار و دسترس‌پذیری</h2>
        <div class="check-options">
          <label><input id="showTimestamps" type="checkbox" checked /><span>نمایش زمان پیام</span></label>
          <label><input id="showBadges" type="checkbox" checked /><span>نمایش نشان‌ها</span></label>
          <label><input id="showReplies" type="checkbox" checked /><span>نمایش پیش‌نمایش پاسخ</span></label>
          <label><input id="userAccents" type="checkbox" checked /><span>رنگ ثابت نام کاربران</span></label>
          <label><input id="debugMode" type="checkbox" /><span>حالت عیب‌یابی جهت متن</span></label>
        </div>
        <label class="mode-label" for="highlight">برجسته‌کردن واژه در چت</label>
        <input id="highlight" class="text-input" type="text" maxlength="40" placeholder="اختیاری" />
      </section>
      <section class="card">
        <h2 class="section-title">پنل افزونه</h2>
        <label class="mode-label" for="popupFont">فونت پنل افزونه</label>
        <select id="popupFont">
          <option value="vazirmatn">Vazirmatn — پیش‌فرض</option>
          <option value="arad">Arad</option>
          <option value="iransans">IRANSans</option>
          <option value="shabnam">Shabnam</option>
          <option value="system">سیستم</option>
        </select>
      </section>
      <section class="hint">
        <span aria-hidden="true">↻</span>
        <p>پس از تغییر تنظیمات، صفحهٔ Kick را تازه کنید.</p>
      </section>
      <button id="reload" class="reload" type="button">
        تازه‌سازی صفحهٔ Kick
      </button>
      <p class="footer">تنظیمات فقط روی نمایش پیام‌های چت اثر می‌گذارند</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
